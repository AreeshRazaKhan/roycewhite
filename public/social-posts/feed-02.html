<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-02 — Quote Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--patriot:#D42027;--patriot-dark:#A8181E;--patriot-glow:rgba(212,32,39,.12);--liberty:#29ABE2;--liberty-light:#5EC4ED;--liberty-pale:rgba(41,171,226,.10);--navy-900:#0A1628;--navy-800:#0F1D34;--navy-700:#162840;--navy-600:#1E3550;--parchment:#F5F0EB;--stone-100:#EDE8E0;--stone-200:#DBD5CB;--stone-400:#9C968A;--stone-600:#6B7280;--ink:#141722;--moonlight:#EDEBE3;--gold:#C8A44E;--gold-light:#E0C978;--white:#FFFFFF;--hairline:rgba(212,32,39,.18);--font-display:'Playfair Display',Georgia,serif;--font-body:'Inter',-apple-system,sans-serif;--font-accent:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#101419;font-family:var(--font-body)}
.post{position:absolute;left:50%;top:50%;width:1080px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--parchment);overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.canvas{position:absolute;inset:0;overflow:hidden}
.frame{position:absolute;inset:44px;border:1px solid var(--stone-200);pointer-events:none}
.score{position:absolute;left:0;bottom:150px;width:100%;height:70px;pointer-events:none}
.score .sl{position:absolute;height:1px;left:0}
.sl-1{top:0;width:45%;background:linear-gradient(90deg,var(--patriot),transparent);opacity:.12}
.sl-2{top:8px;width:28%;background:linear-gradient(90deg,var(--liberty),transparent);opacity:.15}
.sl-3{top:16px;width:62%;background:linear-gradient(90deg,var(--patriot),transparent);opacity:.08}
.sl-4{top:24px;width:18%;background:linear-gradient(90deg,var(--liberty),transparent);opacity:.18}
.sl-5{top:32px;width:38%;background:linear-gradient(90deg,var(--patriot),transparent);opacity:.10}
.quote-glyph{position:absolute;top:104px;left:84px;font:700 260px/1 var(--font-display);color:var(--liberty);opacity:.22;pointer-events:none}
.eyebrow{position:absolute;top:108px;right:110px;display:inline-flex;align-items:center;gap:14px;font:600 19px var(--font-accent);letter-spacing:.2em;text-transform:uppercase;color:var(--patriot)}
.eyebrow::before{content:"";width:42px;height:1px;background:currentColor}
.content{position:absolute;left:110px;right:110px;top:330px}
.headline{font:700 58px/1.3 var(--font-display);font-style:italic;color:var(--navy-900);margin-bottom:52px}
.attribution{display:flex;align-items:center;gap:18px}
.attribution .rule{width:54px;height:2px;background:var(--patriot)}
.subhead{font:500 22px/1.4 var(--font-accent);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.body{font:500 14px/1.5 var(--font-accent);letter-spacing:.12em;text-transform:uppercase;color:var(--stone-600);margin-top:8px}
.logo-slot{position:absolute;bottom:104px;left:110px;display:flex;align-items:center;gap:16px}
.torch{width:36px;height:64px}
.logo-name{font:700 20px var(--font-accent);letter-spacing:.18em;text-transform:uppercase;color:var(--navy-900)}
.logo-tag{display:block;margin-top:5px;font:500 11px var(--font-accent);letter-spacing:.2em;text-transform:uppercase;color:var(--stone-400)}
.cta{position:absolute;bottom:108px;right:110px;display:inline-block;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:20px 40px;font:600 15px/1 var(--font-accent);letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--navy-900);border:1.5px solid var(--navy-900);text-decoration:none}
</style>
</head>
<body>
<div class="post">
<div class="canvas">
  <div class="frame"></div>
  <div class="quote-glyph">&ldquo;</div>
  <div class="eyebrow">Endorsements</div>
  <div class="score"><span class="sl sl-1"></span><span class="sl sl-2"></span><span class="sl sl-3"></span><span class="sl sl-4"></span><span class="sl sl-5"></span></div>
  <div class="content">
    <blockquote class="headline">&ldquo;He is a thoughtful leader for the populist movement in American politics.&rdquo;</blockquote>
    <div class="attribution">
      <span class="rule"></span>
      <div>
        <div class="subhead">— Steve Bannon</div>
        <div class="body">National Talk Show Host</div>
      </div>
    </div>
  </div>
  <div class="logo-slot">
    <svg class="torch" viewBox="0 0 200 350" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 20 C90 60,70 80,75 120 C78 140,90 150,100 155 C110 150,122 140,125 120 C130 80,110 60,100 20Z" fill="#D42027"/><path d="M100 50 C95 75,82 90,85 120 C87 135,95 145,100 148 C105 145,113 135,115 120 C118 90,105 75,100 50Z" fill="#D42027" opacity=".6"/><rect x="85" y="160" width="30" height="12" rx="3" fill="#29ABE2"/><rect x="88" y="175" width="24" height="8" rx="2" fill="#29ABE2"/><polygon points="92,185 108,185 104,260 96,260" fill="#29ABE2"/></svg>
    <div><span class="logo-name">Royce White</span><span class="logo-tag">For U.S. Senate</span></div>
  </div>
  <a class="cta" href="#">All Endorsements</a>
</div>
</div>
<script>(function(){var p=document.querySelector('.post');function f(){p.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1080,1))}addEventListener('resize',f);f()})();</script>
</body>
</html>
