<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-07 — Hook + CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--patriot:#D42027;--patriot-dark:#A8181E;--patriot-glow:rgba(212,32,39,.12);--liberty:#29ABE2;--liberty-light:#5EC4ED;--liberty-pale:rgba(41,171,226,.10);--navy-900:#0A1628;--navy-800:#0F1D34;--navy-700:#162840;--navy-600:#1E3550;--parchment:#F5F0EB;--stone-100:#EDE8E0;--stone-200:#DBD5CB;--stone-400:#9C968A;--stone-600:#6B7280;--ink:#141722;--moonlight:#EDEBE3;--gold:#C8A44E;--gold-light:#E0C978;--white:#FFFFFF;--hairline:rgba(212,32,39,.18);--font-display:'Playfair Display',Georgia,serif;--font-body:'Inter',-apple-system,sans-serif;--font-accent:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#101419;font-family:var(--font-body)}
.post{position:absolute;left:50%;top:50%;width:1080px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--parchment);overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.canvas{position:absolute;inset:0;overflow:hidden}
.bracket-tl{position:absolute;top:40px;left:40px;width:60px;height:60px;border-top:2px solid var(--patriot);border-left:2px solid var(--patriot)}
.bracket-br{position:absolute;bottom:40px;right:40px;width:60px;height:60px;border-bottom:2px solid var(--liberty);border-right:2px solid var(--liberty)}
.dot-tr{position:absolute;top:46px;right:46px;width:6px;height:6px;background:var(--patriot);border-radius:50%}
.dot-bl{position:absolute;bottom:46px;left:46px;width:6px;height:6px;background:var(--liberty);border-radius:50%}
.geo{position:absolute;pointer-events:none}
.geo-circle{width:90px;height:90px;border-radius:50%;border:1.5px solid var(--navy-900);opacity:.06;top:140px;right:140px}
.geo-diamond{width:24px;height:24px;border:1.5px solid var(--patriot);transform:rotate(45deg);opacity:.10;top:300px;right:240px}
.geo-plus{font:700 28px var(--font-accent);color:var(--liberty);opacity:.10;top:230px;right:330px}
.logo-slot{position:absolute;top:84px;left:90px;display:flex;align-items:center;gap:16px}
.torch{width:36px;height:64px}
.logo-name{font:700 20px var(--font-accent);letter-spacing:.18em;text-transform:uppercase;color:var(--navy-900)}
.logo-tag{display:block;margin-top:5px;font:500 11px var(--font-accent);letter-spacing:.2em;text-transform:uppercase;color:var(--stone-400)}
.content{position:absolute;left:90px;right:120px;top:300px}
.headline{font:900 96px/1.06 var(--font-display);letter-spacing:-.02em;color:var(--ink);margin-bottom:40px}
.headline em{font-style:italic;color:var(--patriot)}
.subhead{font:300 27px/1.65 var(--font-body);color:var(--stone-600);max-width:700px;margin-bottom:56px}
.cta{display:inline-block;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:26px 56px;font:600 18px/1 var(--font-accent);letter-spacing:.12em;text-transform:uppercase;background:var(--patriot);color:var(--white);border:1.5px solid var(--patriot);text-decoration:none}
.footer-meta{position:absolute;left:90px;right:90px;bottom:88px;display:flex;justify-content:space-between;font:400 13px var(--font-accent);letter-spacing:.16em;text-transform:uppercase;color:var(--stone-400);padding-top:22px;border-top:1px solid var(--stone-200)}
</style>
</head>
<body>
<div class="post">
<div class="canvas">
  <div class="bracket-tl"></div><div class="bracket-br"></div>
  <div class="dot-tr"></div><div class="dot-bl"></div>
  <div class="geo geo-circle"></div>
  <div class="geo geo-diamond"></div>
  <div class="geo geo-plus">+</div>
  <div class="logo-slot">
    <svg class="torch" viewBox="0 0 200 350" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 20 C90 60,70 80,75 120 C78 140,90 150,100 155 C110 150,122 140,125 120 C130 80,110 60,100 20Z" fill="#D42027"/><path d="M100 50 C95 75,82 90,85 120 C87 135,95 145,100 148 C105 145,113 135,115 120 C118 90,105 75,100 50Z" fill="#D42027" opacity=".6"/><rect x="85" y="160" width="30" height="12" rx="3" fill="#29ABE2"/><rect x="88" y="175" width="24" height="8" rx="2" fill="#29ABE2"/><polygon points="92,185 108,185 104,260 96,260" fill="#29ABE2"/></svg>
    <div><span class="logo-name">Royce White</span><span class="logo-tag">For U.S. Senate</span></div>
  </div>
  <div class="content">
    <h1 class="headline">What's wrong with taking care of <em>Americans first?</em></h1>
    <p class="subhead">No focus groups. No consultants. Just the truth, told plain.</p>
    <a class="cta" href="#">Stand With Royce →</a>
  </div>
  <div class="footer-meta"><span>God · Family · Country</span><span>roycewhite.us</span></div>
</div>
</div>
<script>(function(){var p=document.querySelector('.post');function f(){p.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1080,1))}addEventListener('resize',f);f()})();</script>
</body>
</html>
