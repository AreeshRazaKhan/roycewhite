<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>feed-05 — Event Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--patriot:#D42027;--patriot-dark:#A8181E;--patriot-glow:rgba(212,32,39,.12);--liberty:#29ABE2;--liberty-light:#5EC4ED;--liberty-pale:rgba(41,171,226,.10);--navy-900:#0A1628;--navy-800:#0F1D34;--navy-700:#162840;--navy-600:#1E3550;--parchment:#F5F0EB;--stone-100:#EDE8E0;--stone-200:#DBD5CB;--stone-400:#9C968A;--stone-600:#6B7280;--ink:#141722;--moonlight:#EDEBE3;--gold:#C8A44E;--gold-light:#E0C978;--white:#FFFFFF;--hairline:rgba(212,32,39,.18);--font-display:'Playfair Display',Georgia,serif;--font-body:'Inter',-apple-system,sans-serif;--font-accent:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#101419;font-family:var(--font-body)}
.post{position:absolute;left:50%;top:50%;width:1080px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--parchment);overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.canvas{position:absolute;inset:0;overflow:hidden}
.logo-slot{position:absolute;top:84px;left:90px;display:flex;align-items:center;gap:16px}
.torch{width:36px;height:64px}
.logo-name{font:700 20px var(--font-accent);letter-spacing:.18em;text-transform:uppercase;color:var(--navy-900)}
.logo-tag{display:block;margin-top:5px;font:500 11px var(--font-accent);letter-spacing:.2em;text-transform:uppercase;color:var(--stone-400)}
.eyebrow{position:absolute;top:104px;right:90px;display:inline-flex;align-items:center;gap:14px;font:600 19px var(--font-accent);letter-spacing:.2em;text-transform:uppercase;color:var(--patriot)}
.eyebrow::before{content:"";width:42px;height:1px;background:currentColor}
.card{position:absolute;left:90px;right:90px;top:236px;bottom:200px;background:var(--white);border:1px solid var(--stone-200);border-radius:4px;padding:70px;display:flex;gap:60px}
.card::before{content:"";position:absolute;top:0;left:0;width:96px;height:4px;background:var(--patriot)}
.date{flex:0 0 220px;border-right:1px solid var(--stone-200);padding-right:50px}
.date .num{font:900 150px/1 var(--font-display);letter-spacing:-.04em;color:var(--navy-900)}
.date .mon{font:600 24px var(--font-accent);letter-spacing:.2em;text-transform:uppercase;color:var(--patriot);margin-top:12px}
.date .yr{font:400 16px var(--font-mono);letter-spacing:.1em;color:var(--stone-400);margin-top:8px}
.details{flex:1;display:flex;flex-direction:column}
.headline{font:800 56px/1.15 var(--font-display);letter-spacing:-.01em;color:var(--navy-900);margin-bottom:30px}
.headline em{font-style:italic;color:var(--patriot)}
.meta-row{display:flex;gap:16px;align-items:baseline;margin-bottom:16px}
.meta-row .k{font:500 13px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--patriot);width:130px}
.meta-row .v{font:500 21px var(--font-body);color:var(--ink)}
.body{font:400 18px/1.65 var(--font-body);color:var(--stone-600);margin-top:14px;max-width:480px}
.cta{margin-top:auto;align-self:flex-start;display:inline-block;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:22px 44px;font:600 16px/1 var(--font-accent);letter-spacing:.12em;text-transform:uppercase;background:var(--navy-900);color:var(--white);border:1.5px solid var(--navy-900);text-decoration:none}
.footer-meta{position:absolute;left:90px;right:90px;bottom:96px;display:flex;justify-content:space-between;font:400 13px var(--font-accent);letter-spacing:.16em;text-transform:uppercase;color:var(--stone-400);padding-top:22px;border-top:1px solid var(--stone-200)}
</style>
</head>
<body>
<div class="post">
<div class="canvas">
  <div class="logo-slot">
    <svg class="torch" viewBox="0 0 200 350" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 20 C90 60,70 80,75 120 C78 140,90 150,100 155 C110 150,122 140,125 120 C130 80,110 60,100 20Z" fill="#D42027"/><path d="M100 50 C95 75,82 90,85 120 C87 135,95 145,100 148 C105 145,113 135,115 120 C118 90,105 75,100 50Z" fill="#D42027" opacity=".6"/><rect x="85" y="160" width="30" height="12" rx="3" fill="#29ABE2"/><rect x="88" y="175" width="24" height="8" rx="2" fill="#29ABE2"/><polygon points="92,185 108,185 104,260 96,260" fill="#29ABE2"/></svg>
    <div><span class="logo-name">Royce White</span><span class="logo-tag">For U.S. Senate</span></div>
  </div>
  <div class="eyebrow">From the FAQs</div>
  <div class="card">
    <div class="date">
      <div class="num">05</div>
      <div class="mon">FAQs</div>
      <div class="yr">/ 05 of 05</div>
    </div>
    <div class="details">
      <h1 class="headline">Am I Trump <em>endorsed?</em></h1>
      <div class="meta-row"><span class="k">Topic</span><span class="v">The MAGA Movement</span></div>
      <div class="meta-row"><span class="k">Endorsed by</span><span class="v">Kari Lake · Matt Gaetz</span></div>
      <p class="body">I am not Trump endorsed but would love to be — and will support his bid regardless.</p>
      <a class="cta" href="#">Read the FAQs →</a>
    </div>
  </div>
  <div class="footer-meta"><span>Royce White for Senate · 2026</span><span>roycewhite.us/faqs</span></div>
</div>
</div>
<script>(function(){var p=document.querySelector('.post');function f(){p.style.setProperty('--s',Math.min(innerWidth/1080,innerHeight/1080,1))}addEventListener('resize',f);f()})();</script>
</body>
</html>
